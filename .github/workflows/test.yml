name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure jq is available
        run: command -v jq || brew install jq
      - name: Plugin contracts
        run: bash plugin/test.sh
      - name: History import
        run: python3 tests/test_import.py
      - name: Install and uninstall
        run: bash tests/test_install.sh
